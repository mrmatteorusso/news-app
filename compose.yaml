services:
  dashboard:
    build:
      context: .
    container_name: personal-news-dashboard
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Rome}"
      FINANCE_CACHE_MINUTES: "${FINANCE_CACHE_MINUTES:-60}"
      MARKET_HISTORY_REFRESH_HOURS: "${MARKET_HISTORY_REFRESH_HOURS:-168}"
      ARTICLE_RETENTION_DAYS: "${ARTICLE_RETENTION_DAYS:-90}"
      LLM_ENABLED: "${LLM_ENABLED:-true}"
      LLM_BASE_URL: "${LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
      LLM_MODEL: "${LLM_MODEL:-gemma-3-4b-it}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_CONNECT_TIMEOUT_SECONDS: "${LLM_CONNECT_TIMEOUT_SECONDS:-3}"
      LLM_REQUEST_TIMEOUT_SECONDS: "${LLM_REQUEST_TIMEOUT_SECONDS:-180}"
      LLM_RETRY_AFTER_MINUTES: "${LLM_RETRY_AFTER_MINUTES:-10}"
      LLM_MAX_CANDIDATES: "${LLM_MAX_CANDIDATES:-10}"
      LLM_CHUNK_SIZE: "${LLM_CHUNK_SIZE:-8}"
      LLM_MAX_OUTPUT_TOKENS: "${LLM_MAX_OUTPUT_TOKENS:-420}"
    volumes:
      - ./public:/var/www/html:ro
      - ./src:/var/www/src:ro
      - ./config:/var/www/config:ro
      - ./database:/var/www/database:ro
      - ./profiles:/var/www/profiles:ro
      - ./tests:/var/www/tests:ro
      - ./storage:/var/www/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1/health.php') === false ? 1 : 0);\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
